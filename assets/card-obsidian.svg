<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg-obs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="50%" stop-color="#151b27"/>
      <stop offset="100%" stop-color="#242e42"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8012"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <linearGradient id="chip-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="50%" stop-color="#caa34e"/>
      <stop offset="100%" stop-color="#fff0b8"/>
    </linearGradient>
    <linearGradient id="sheen-obs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="400" height="250" rx="20" fill="url(#bg-obs)"/>
  <rect width="398" height="248" x="1" y="1" rx="19" fill="none" stroke="url(#gold-foil)" stroke-width="1" opacity="0.4"/>

  <!-- Geometric Luxury Line Lattice -->
  <g opacity="0.15" stroke="url(#gold-foil)" fill="none" stroke-width="0.9">
    <path d="M 0 40 L 400 200 M 0 80 L 400 240 M 0 120 L 320 250" />
    <path d="M 400 40 L 0 200 M 400 80 L 0 240 M 400 120 L 80 250" />
    <circle cx="200" cy="125" r="80" stroke-dasharray="3 5"/>
    <circle cx="200" cy="125" r="120" opacity="0.5"/>
  </g>

  <!-- Light Beam / Sheen -->
  <path d="M0 0 L210 0 L80 250 L0 250 Z" fill="url(#sheen-obs)"/>

  <!-- Logo -->
  <g transform="translate(30, 28)">
    <path d="M4 12c4-8 12-8 16 0-4 8-12 8-16 0z" fill="none" stroke="url(#gold-foil)" stroke-width="2.3"/>
    <text x="32" y="18" fill="url(#gold-foil)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">Toucan</text>
    <text x="110" y="18" fill="#e2c268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2">WORLD ELITE</text>
  </g>

  <!-- Contactless waves -->
  <g transform="translate(340, 28)" stroke="url(#gold-foil)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0 4 A 12 12 0 0 1 0 20" stroke-linecap="round"/>
    <path d="M5 1 A 17 17 0 0 1 5 23" stroke-linecap="round"/>
    <path d="M10 -2 A 22 22 0 0 1 10 26" stroke-linecap="round"/>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(32, 78)">
    <rect width="44" height="34" rx="6" fill="url(#chip-gold)" stroke="#9c7826" stroke-width="0.8"/>
    <path d="M 0 11 H 16 M 28 11 H 44 M 0 23 H 16 M 28 23 H 44" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <rect x="16" y="8" width="12" height="18" rx="3" fill="none" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="0" x2="22" y2="8" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="26" x2="22" y2="34" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Card Number -->
  <text x="32" y="162" fill="#f5e6b8" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" letter-spacing="3.2" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.6))">
    5512 &#160;7304 &#160;8820 &#160;9182
  </text>

  <!-- Cardholder Details -->
  <g transform="translate(32, 206)">
    <text x="0" y="0" fill="#a4936b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">CARDHOLDER</text>
    <text x="0" y="16" fill="#f5e6b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRIYA SHARMA</text>
  </g>

  <!-- Expiry -->
  <g transform="translate(200, 206)">
    <text x="0" y="0" fill="#a4936b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">EXPIRES</text>
    <text x="0" y="16" fill="#f5e6b8" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700">11/28</text>
  </g>

  <!-- Interlocking circles badge -->
  <g transform="translate(320, 192)">
    <circle cx="14" cy="16" r="15" fill="#d4af37" opacity="0.85"/>
    <circle cx="30" cy="16" r="15" fill="#f3e5ab" opacity="0.75"/>
  </g>
</svg>