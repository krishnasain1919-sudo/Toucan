<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 160" width="325" height="160">
  <defs>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043828"/>
      <stop offset="42%" stop-color="#0b6649"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="chip-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sheen-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow-emr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="325" height="160" fill="url(#bg-emerald)"/>

  <!-- Flowing Vector Mesh -->
  <g opacity="0.22" stroke="#a7f3d0" fill="none" stroke-width="1.1">
    <path d="M-20,120 Q60,30 160,80 T340,40" />
    <path d="M-20,140 Q70,50 180,100 T340,60" />
    <circle cx="280" cy="115" r="45" stroke-dasharray="2 3"/>
  </g>

  <!-- Sheen Sweep -->
  <path d="M0 0 L170 0 L65 160 L0 160 Z" fill="url(#sheen-emerald)"/>

  <!-- Toucan Logo -->
  <g transform="translate(20, 16)">
    <path d="M3 9c3-6 9-6 12 0-3 6-9 6-12 0z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">Toucan</text>
    <text x="82" y="12" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">CORPORATE</text>
  </g>

  <!-- Contactless Payment Waves -->
  <g transform="translate(285, 16)" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M0 3 A 8 8 0 0 1 0 15" stroke-linecap="round"/>
    <path d="M4 1 A 12 12 0 0 1 4 17" stroke-linecap="round"/>
    <path d="M8 -1 A 16 16 0 0 1 8 19" stroke-linecap="round"/>
  </g>

  <!-- Dual-tone Titanium Chip -->
  <g transform="translate(22, 46)">
    <rect width="36" height="26" rx="4" fill="url(#chip-silver)" stroke="#475569" stroke-width="0.7"/>
    <path d="M0 9 H13 M23 9 H36 M0 17 H13 M23 17 H36" stroke="#334155" stroke-width="0.7" opacity="0.85"/>
    <rect x="13" y="6" width="10" height="14" rx="2" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.85"/>
    <line x1="18" y1="0" x2="18" y2="6" stroke="#334155" stroke-width="0.7" opacity="0.85"/>
    <line x1="18" y1="20" x2="18" y2="26" stroke="#334155" stroke-width="0.7" opacity="0.85"/>
  </g>

  <!-- Embossed Card Number -->
  <text x="22" y="108" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" letter-spacing="2.6" filter="url(#shadow-emr)">
    4890 &nbsp;3192 &nbsp;6604 &nbsp;1094
  </text>

  <!-- Cardholder Details -->
  <g transform="translate(22, 126)">
    <text x="0" y="8" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1">BUSINESS ENTITY</text>
    <text x="0" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">ORBIT TRAVELS</text>
  </g>

  <!-- Expiry -->
  <g transform="translate(155, 126)">
    <text x="0" y="8" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1">EXPIRES</text>
    <text x="0" y="21" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold">04/30</text>
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(255, 124)">
    <rect width="36" height="22" rx="4" fill="none" stroke="#a7f3d0" stroke-width="1.2" opacity="0.9"/>
    <text x="18" y="14" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="1">FLEX</text>
  </g>
</svg>