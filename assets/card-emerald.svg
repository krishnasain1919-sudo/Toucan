<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg-emr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05261c"/>
      <stop offset="48%" stop-color="#0d523e"/>
      <stop offset="100%" stop-color="#198263"/>
    </linearGradient>
    <linearGradient id="chip-emr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c9"/>
      <stop offset="50%" stop-color="#cfab59"/>
      <stop offset="100%" stop-color="#fae79d"/>
    </linearGradient>
    <linearGradient id="sheen-emr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="400" height="250" rx="20" fill="url(#bg-emr)"/>

  <!-- Fluid wave vectors -->
  <g opacity="0.22" stroke="#68dfb7" fill="none" stroke-width="1.3">
    <path d="M -20 180 Q 90 60, 200 130 T 420 80" />
    <path d="M -20 200 Q 110 80, 220 150 T 420 100" />
    <path d="M -20 220 Q 130 100, 240 170 T 420 120" />
    <circle cx="350" cy="190" r="70" stroke-dasharray="2 4"/>
  </g>

  <!-- Light Beam Sheen -->
  <path d="M0 0 L230 0 L100 250 L0 250 Z" fill="url(#sheen-emr)"/>

  <!-- Logo -->
  <g transform="translate(30, 28)">
    <path d="M4 12c4-8 12-8 16 0-4 8-12 8-16 0z" fill="none" stroke="#7cf2cb" stroke-width="2.3"/>
    <text x="32" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">Toucan</text>
    <text x="110" y="18" fill="#7cf2cb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2">CORPORATE</text>
  </g>

  <!-- Contactless waves -->
  <g transform="translate(340, 28)" stroke="#7cf2cb" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0 4 A 12 12 0 0 1 0 20" stroke-linecap="round"/>
    <path d="M5 1 A 17 17 0 0 1 5 23" stroke-linecap="round"/>
    <path d="M10 -2 A 22 22 0 0 1 10 26" stroke-linecap="round"/>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(32, 78)">
    <rect width="44" height="34" rx="6" fill="url(#chip-emr)" stroke="#9c7826" stroke-width="0.8"/>
    <path d="M 0 11 H 16 M 28 11 H 44 M 0 23 H 16 M 28 23 H 44" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <rect x="16" y="8" width="12" height="18" rx="3" fill="none" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="0" x2="22" y2="8" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="26" x2="22" y2="34" stroke="#684e11" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Card Number -->
  <text x="32" y="162" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" letter-spacing="3.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
    4890 &#160;3192 &#160;6604 &#160;1094
  </text>

  <!-- Cardholder Details -->
  <g transform="translate(32, 206)">
    <text x="0" y="0" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">BUSINESS ENTITY</text>
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ORBIT TRAVELS</text>
  </g>

  <!-- Expiry -->
  <g transform="translate(200, 206)">
    <text x="0" y="0" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">EXPIRES</text>
    <text x="0" y="16" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700">04/30</text>
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(325, 190)">
    <rect width="45" height="28" rx="5" fill="none" stroke="#7cf2cb" stroke-width="1.4" opacity="0.8"/>
    <text x="22.5" y="18" fill="#7cf2cb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">FLEX</text>
  </g>
</svg>