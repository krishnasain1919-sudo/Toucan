<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b70"/>
      <stop offset="45%" stop-color="#2451c2"/>
      <stop offset="100%" stop-color="#5580ea"/>
    </linearGradient>
    <linearGradient id="chip-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe299"/>
      <stop offset="50%" stop-color="#c99e46"/>
      <stop offset="100%" stop-color="#f5d57f"/>
    </linearGradient>
    <linearGradient id="sheen-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-plat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="400" height="250" rx="20" fill="url(#bg-plat)"/>

  <!-- Guilloche / Wave Patterns -->
  <g opacity="0.18" stroke="#ffffff" fill="none" stroke-width="1.2">
    <path d="M-20 60 C 80 10, 160 140, 260 70 S 360 20, 440 80" />
    <path d="M-20 90 C 90 30, 180 170, 280 90 S 380 40, 440 110" />
    <path d="M-20 120 C 100 50, 200 200, 300 110 S 400 60, 440 140" />
    <circle cx="340" cy="50" r="90" stroke-dasharray="4 4"/>
    <circle cx="340" cy="50" r="60"/>
  </g>

  <!-- Glass / Sheen overlay -->
  <path d="M0 0 L240 0 L90 250 L0 250 Z" fill="url(#sheen-plat)"/>

  <!-- Logo -->
  <g transform="translate(30, 28)">
    <path d="M4 12c4-8 12-8 16 0-4 8-12 8-16 0z" fill="none" stroke="#ffffff" stroke-width="2.3"/>
    <text x="32" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">Toucan</text>
    <text x="110" y="18" fill="rgba(255,255,255,0.7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PLATINUM</text>
  </g>

  <!-- Contactless waves -->
  <g transform="translate(340, 28)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.85">
    <path d="M0 4 A 12 12 0 0 1 0 20" stroke-linecap="round"/>
    <path d="M5 1 A 17 17 0 0 1 5 23" stroke-linecap="round"/>
    <path d="M10 -2 A 22 22 0 0 1 10 26" stroke-linecap="round"/>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(32, 78)">
    <rect width="44" height="34" rx="6" fill="url(#chip-plat)" stroke="#b58d36" stroke-width="0.8"/>
    <!-- Chip contacts -->
    <path d="M 0 11 H 16 M 28 11 H 44 M 0 23 H 16 M 28 23 H 44" stroke="#8a631c" stroke-width="0.8" opacity="0.8"/>
    <rect x="16" y="8" width="12" height="18" rx="3" fill="none" stroke="#8a631c" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="0" x2="22" y2="8" stroke="#8a631c" stroke-width="0.8" opacity="0.8"/>
    <line x1="22" y1="26" x2="22" y2="34" stroke="#8a631c" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Card Number -->
  <text x="32" y="162" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" letter-spacing="3.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.35))">
    4242 &#160;8920 &#160;4110 &#160;4242
  </text>

  <!-- Cardholder Details -->
  <g transform="translate(32, 206)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">CARDHOLDER</text>
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">A. MERCHANT</text>
  </g>

  <!-- Expiry -->
  <g transform="translate(200, 206)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">EXPIRES</text>
    <text x="0" y="16" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700">09/29</text>
  </g>

  <!-- Card Network Hologram Badge -->
  <g transform="translate(315, 192)">
    <circle cx="16" cy="16" r="15" fill="#eb001b" opacity="0.88"/>
    <circle cx="34" cy="16" r="15" fill="#ff5f00" opacity="0.88"/>
  </g>
</svg>